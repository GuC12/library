name: Publish library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/auth-redirect-site run typecheck
      - name: Build static website
        run: pnpm --filter @workspace/auth-redirect-site run build:pages
        env:
          BASE_PATH: /library/
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_Z29vZC13YXJ0aG9nLTIxMzAuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://agczrwolpybmbwsyfond.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnY3pyd29scHlibWJ3c3lmb25kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3ODk0NTMsImV4cCI6MjEwNTM2NTQ1M30.3ti-SrKUIKz_nd9YGbg0emw8tfxEdUQ23NVeBZ3Xd3Y' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/auth-redirect-site/dist/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
